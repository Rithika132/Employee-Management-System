<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <h1>Employee Management System</h1>


        <div class="form-box">

            <h2>Add Employee</h2>

            <form id="employeeForm">

                <input type="hidden"
                       id="employeeId">


                <input type="text"
                       id="name"
                       placeholder="Employee Name"
                       required>


                <input type="email"
                       id="email"
                       placeholder="Email"
                       required>


                <input type="text"
                       id="phone"
                       placeholder="Phone Number"
                       required>


                <input type="text"
                       id="department"
                       placeholder="Department"
                       required>


                <input type="text"
                       id="position"
                       placeholder="Position"
                       required>


                <input type="number"
                       id="salary"
                       placeholder="Salary"
                       required>


                <input type="date"
                       id="joining_date"
                       required>


                <button type="submit">
                    Save Employee
                </button>


                <button type="button"
                        onclick="resetForm()">
                    Clear
                </button>

            </form>

        </div>


        <div class="employee-list">

            <h2>Employee List</h2>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Position</th>
                        <th>Salary</th>
                        <th>Joining Date</th>
                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="employeeTable">

                </tbody>

            </table>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
